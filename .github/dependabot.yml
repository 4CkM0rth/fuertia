# Dependabot abre PR semanales con actualizaciones de dependencias y de acciones del CI.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencias-de-desarrollo:
        dependency-type: development
    # Expo fija versiones compatibles de estos paquetes para cada SDK. Subirlos por separado
    # puede romper la app en el celular aunque las pruebas pasen. Se actualizan juntos al
    # cambiar de SDK con `npx expo install --fix`.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "jest-expo"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
  - package-ecosystem: terraform
    directories:
      - /infra/terraform/ambientes/pruebas
    schedule:
      interval: weekly
