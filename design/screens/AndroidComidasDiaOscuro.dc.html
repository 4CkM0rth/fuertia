<!doctype html>
<html lang="es" style="color-scheme: dark">
<head>
<meta charset="utf-8">
<title>Comidas del día · Android · oscuro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#E2C171;text-decoration:none}a:hover{color:#E9D6A8}
</style>
</helmet>
<div style="width: 412px; height: 1291px; box-sizing: border-box; background:#111214; color:#EDEEF0; font-family: Poppins, system-ui, sans-serif; display: flex; flex-direction: column; padding: 40px 16px 28px; gap: 14px">
  <div style="display: flex; align-items: center; gap: 10px">
    <a href="AndroidHoyOscuro.dc.html" aria-label="Volver" style="width: 48px; height: 48px; border-radius:24px; margin-left: -8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EDEEF0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
    </a>
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 13px; color:#A7AAB1; font-weight: 500">Escoge una opción por comida</span>
      <h1 style="margin: 0; font-size: 22px; font-weight: 700">Comidas de hoy</h1>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background:#2A2B2F; padding: 4px; border-radius:14px" role="group" aria-label="Comida">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
      <button onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="height: 44px; border-radius:11px; border:none; background: {{t.bg}}; color:#EDEEF0; font-family: inherit; font-size: 13px; font-weight: {{t.fw}}; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2">{{t.label}}<span style="font-size: 11px; font-weight: 500; color:#A7AAB1">{{t.time}}</span></button>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
      <div style="background:#1C1D20; border: {{o.border}}; border-radius:20px; overflow: hidden; display: flex; flex-direction: column">
        <div style="position: relative">
          <img src="{{o.img}}" alt="Foto de referencia: {{o.name}}" style="width: 100%; height: 130px; object-fit: cover; display: block">
          <span style="position: absolute; left: 10px; top: 10px; font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius:999px; background:rgba(20,12,14,0.85); color:#FFFFFF">Opción {{o.k}} · {{o.kcal}} kcal</span>
        </div>
        <div style="padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 16px; font-weight: 800">{{o.name}}</span>
          <span style="font-size: 13px; color:#A7AAB1; line-height: 1.45">{{o.items}}</span>
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
            <span style="font-size: 12px; color:#A7AAB1; font-weight: 600">P {{o.p}} · C {{o.c}} · G {{o.f}}</span>
            <button onClick="{{o.pick}}" style="height: 40px; padding: 0 14px; border-radius:12px; border:none; background: {{o.btnBg}}; color: {{o.btnFg}}; font-family: inherit; font-size: 13px; font-weight: 800; cursor: pointer">{{o.btn}}</button>
          </div>
        </div>
      </div>
    </sc-for>
  </div>
  <a href="AndroidListaMercadoOscuro.dc.html" style="flex-shrink: 0; min-height: 56px; margin-top: 6px; padding: 0 20px; border-radius:28px; gap: 10px; background:#25262A; color:#FFFFFF; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/></svg>Ver lista de mercado de la semana</a>
  <p style="margin: 0; font-size: 11px; color:#A7AAB1; line-height: 1.45">Fotos de referencia generadas con IA para mostrar cómo se ve el plato. La porción exacta es la de los gramos.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":1291}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { meal: 1, picked: { 0: 'A', 1: null, 2: null } };
  }
  renderVals() {
    const meals = [
      { label: 'Desayuno', time: '7:00 a. m.', opts: [
        { k: 'A', name: 'Huevos con arepa', img: '/_blob/65ca6ab9a5e034e0c8c2dc047a107d77', items: '3 huevos · arepa blanca 110 g · papaya 200 g', kcal: 561, p: 33, c: 70, f: 17 },
        { k: 'B', name: 'Yogur con avena', img: '/_blob/9a11d9b05766872e087c5ec3ce0ddd67', items: 'Yogur griego 250 g · avena 45 g · banano 120 g · nueces 15 g', kcal: 578, p: 37, c: 72, f: 17 },
        { k: 'C', name: 'Sándwich de pollo', img: '/_blob/bc9ec2ddd3c34a105dacfe2aab078692', items: 'Pan integral 2 tajadas · pollo 120 g · aguacate 40 g · tomate', kcal: 493, p: 47, c: 45, f: 13 }
      ] },
      { label: 'Almuerzo', time: '1:00 p. m.', opts: [
        { k: 'A', name: 'Pollo, arroz y ensalada', img: '/_blob/de18b4b324e33e95f137b878c9ed4121', items: 'Pollo 180 g · arroz cocido 200 g · ensalada 200 g · aguacate 40 g', kcal: 624, p: 49, c: 67, f: 17 },
        { k: 'B', name: 'Carne, papa y ensalada', img: '/_blob/65d2157733686c13fee629800bb6dd2e', items: 'Res magra 180 g · papa cocida 370 g · ensalada 200 g', kcal: 640, p: 47, c: 82, f: 15 },
        { k: 'C', name: 'Pescado, yuca y verduras', img: '/_blob/3b2b4b0f44b3ea5bf8fe1843b138de5b', items: 'Tilapia 230 g · yuca 200 g · verduras 200 g · aguacate 40 g', kcal: 612, p: 50, c: 70, f: 14 }
      ] },
      { label: 'Cena', time: '7:00 p. m.', opts: [
        { k: 'A', name: 'Pollo, papa y verduras', img: '/_blob/e42735c9b45d20e1e9de20dc47f1a973', items: 'Pollo 150 g · papa 250 g · verduras 200 g · almendras 10 g', kcal: 539, p: 45, c: 56, f: 15 },
        { k: 'B', name: 'Huevos, arepa y ensalada', img: '/_blob/338bb20d4fc42225a2acf818558a7ff1', items: '2 huevos + 5 claras · arepa 110 g · ensalada 150 g', kcal: 515, p: 35, c: 54, f: 17 },
        { k: 'C', name: 'Atún, arroz y ensalada', img: '/_blob/eb377c0debaf1d683c740244cdebad53', items: 'Atún en agua 150 g · arroz 180 g · ensalada 200 g · aguacate 40 g', kcal: 528, p: 44, c: 58, f: 13 }
      ] }
    ];
    const mi = this.state.meal;
    const picked = this.state.picked[mi];
    const tabs = meals.map((m, i) => ({
      label: m.label, time: m.time,
      on: i === mi ? 'true' : 'false',
      bg: i === mi ? '#1C1D20' : 'transparent',
      fw: i === mi ? 800 : 600,
      pick: () => this.setState({ meal: i })
    }));
    const opts = meals[mi].opts.map((o) => {
      const done = picked === o.k;
      return {
        ...o,
        border: done ? '2px solid #D4A537' : '1px solid #2A2B2F',
        btn: done ? 'Registrada' : 'Comí esta',
        btnBg: done ? '#4A4B52' : '#2E2818',
        btnFg: done ? '#FFFFFF' : '#E9D6A8',
        pick: () => this.setState({ picked: { ...this.state.picked, [mi]: done ? null : o.k } })
      };
    });
    return { tabs, opts };
  }
}
</script>
</body>
</html>
