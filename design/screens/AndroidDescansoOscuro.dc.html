<!doctype html>
<html lang="es" style="color-scheme: dark">
<head>
<meta charset="utf-8">
<title>Temporizador de descanso · Android · oscuro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#D4A537;text-decoration:none}a:hover{color:#E8C76A}
</style>
</helmet>
<div style="width: 412px; height: 915px; box-sizing: border-box; background:#0B0B0C; color:#FFFFFF; font-family: Poppins, system-ui, sans-serif; display: flex; flex-direction: column; padding: 40px 16px 32px; gap: 18px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="AndroidEntrenamientoOscuro.dc.html" aria-label="Volver a la sesión" style="width: 44px; height: 44px; border-radius:22px; background:#26272B; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </a>
    <span style="font-size: 13px; color:#9DA1A8; font-weight: 600">Sentadilla con barra · serie 2 de 4 hecha</span>
    <span style="width: 44px"></span>
  </div>

  <div style="background:#26272B; border-radius:18px; padding: 12px 16px; display: flex; align-items: center; gap: 12px">
    <span style="width: 36px; height: 36px; border-radius:18px; background:#D4A537; color:#141516; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
    </span>
    <div style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 800">55 kg × 9 reps</span><span style="font-size: 12px; color:#9DA1A8">Igualaste tu mejor serie de 55 kg</span></div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px">
    <span style="font-size: 14px; color:#9DA1A8; font-weight: 600">Descanso</span>
    <div role="timer" aria-label="Tiempo de descanso restante" style="width: 250px; height: 250px; border-radius:125px; background:conic-gradient({{ringColor}} {{deg}}, #26272B 0); display: flex; align-items: center; justify-content: center">
      <div style="width: 222px; height: 222px; border-radius:111px; background:#0B0B0C; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
        <span style="font-size: 60px; font-weight: 800; letter-spacing: -2px; font-variant-numeric: tabular-nums">{{clock}}</span>
        <span style="font-size: 13px; color:#9DA1A8">de 1:30</span>
      </div>
    </div>
    <div style="display: flex; gap: 10px">
      <button onClick="{{minus}}" style="height: 44px; padding: 0 16px; border-radius:22px; border:none; background:#26272B; color:#FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">−15 s</button>
      <button onClick="{{toggle}}" style="height: 44px; padding: 0 20px; border-radius:22px; border:none; background:#1C1D20; color:#EDEEF0; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer">{{toggleLabel}}</button>
      <button onClick="{{plus}}" style="height: 44px; padding: 0 16px; border-radius:22px; border:none; background:#26272B; color:#FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">+15 s</button>
    </div>
  </div>

  <div style="background:#26272B; border-radius:18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 12px; color:#9DA1A8; font-weight: 600">Siguiente</span>
    <span style="font-size: 16px; font-weight: 800">Serie 3 · 55 kg × 8 a 10</span>
  </div>
  <a href="AndroidEntrenamientoOscuro.dc.html" style="height: 56px; border-radius:28px; background:#D4A537; color:#141516; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center">Saltar descanso</a>
  <span style="font-size: 12px; color:#9DA1A8; text-align: center">Arranca solo al marcar una serie. Vibra y suena al terminar, aunque tengas el celular bloqueado.</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { left: 64, total: 90, running: true };
  }
  componentDidMount() {
    this.t = setInterval(() => {
      if (this.state.running && this.state.left > 0) this.setState({ left: this.state.left - 1 });
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const l = this.state.left;
    const mm = Math.floor(l / 60), ss = String(l % 60).padStart(2, '0');
    const pct = Math.max(0, Math.min(1, l / this.state.total));
    return {
      clock: mm + ':' + ss,
      deg: Math.round(pct * 360) + 'deg',
      ringColor: l <= 10 ? '#E8775A' : '#D4A537',
      toggleLabel: this.state.running ? 'Pausar' : 'Seguir',
      toggle: () => this.setState({ running: !this.state.running }),
      minus: () => this.setState({ left: Math.max(0, l - 15) }),
      plus: () => this.setState({ left: l + 15, total: Math.max(this.state.total, l + 15) })
    };
  }
}
</script>
</body>
</html>
