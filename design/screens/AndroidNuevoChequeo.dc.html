<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nuevo chequeo · Android</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7A1E2C;text-decoration:none}a:hover{color:#5C1521}
</style>
</helmet>
<div style="width: 412px; height: 1231px; box-sizing: border-box; background: #FAF6F4; color: #2A1216; font-family: Poppins, system-ui, sans-serif; display: flex; flex-direction: column; padding: 40px 16px 28px; gap: 14px">
  <div style="display: flex; align-items: center; gap: 10px">
    <a href="AndroidProgreso.dc.html" aria-label="Volver a progreso" style="width: 48px; height: 48px; border-radius: 24px; margin-left: -8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2A1216" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
    </a>
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 13px; color: #6E4D52; font-weight: 500">Jueves 29 de octubre</span>
      <h1 style="margin: 0; font-size: 22px; font-weight: 700">Nuevo chequeo</h1>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; background: #EBDDD8; padding: 4px; border-radius: 14px" role="group" aria-label="Tipo de chequeo">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
      <button onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="height: 40px; border-radius: 11px; border: none; background: {{t.bg}}; color: #2A1216; font-family: inherit; font-size: 13px; font-weight: {{t.fw}}; cursor: pointer">{{t.label}}</button>
    </sc-for>
  </div>

  <div style="background: #FFF8EA; border: 1px solid #F1DFB6; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #5C4413">
    <span style="font-weight: 700">Antes de medirte</span>
    <span>En ayunas · después de ir al baño · sin haber entrenado</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{fields}}" as="f" hint-placeholder-count="6">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #6E4D52">{{f.label}}
        <div style="display: flex; align-items: center; height: 48px; border-radius: 12px; border: 1px solid #E5D3CE; background: #FFFFFF; padding: 0 12px">
          <input type="text" inputmode="decimal" value="{{f.value}}" placeholder="{{f.last}}" style="flex-grow: 1; min-width: 0; border: none; background: transparent; font-family: inherit; font-size: 16px; font-weight: 700; color: #2A1216">
          <span style="font-size: 13px; color: #6E4D52">{{f.unit}}</span>
        </div>
      </label>
    </sc-for>
  </div>

  <sc-if value="{{adv}}" hint-placeholder-val="{{ false }}">
    <button style="height: 48px; border-radius: 24px; border: 1px dashed #C4ABAF; background: transparent; color: #7A1E2C; font-family: inherit; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/></svg>Tomar foto de la pantalla de la báscula</button>
  </sc-if>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 12px; color: #6E4D52; text-align: center">El gris es tu último chequeo. IMC y relaciones de cintura se calculan solos.</span>
    <a href="AndroidProgreso.dc.html" style="height: 56px; border-radius: 28px; background: #7A1E2C; color: #FFFFFF; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center">Guardar chequeo</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":1231}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tipo: 'basico' };
  }
  renderVals() {
    const basico = [
      { label: 'Peso', unit: 'kg', value: '64,1', last: '64,6' },
      { label: 'Cuello', unit: 'cm', value: '', last: '31' },
      { label: 'Pecho', unit: 'cm', value: '', last: '88' },
      { label: 'Cintura', unit: 'cm', value: '', last: '76' },
      { label: 'Cadera', unit: 'cm', value: '', last: '97,5' },
      { label: 'Brazo der.', unit: 'cm', value: '', last: '28,5' },
      { label: 'Muñeca der.', unit: 'cm', value: '', last: '15' },
      { label: 'Pierna der.', unit: 'cm', value: '', last: '55' },
      { label: 'Pantorrilla der.', unit: 'cm', value: '', last: '35' }
    ];
    const avanzado = [
      { label: 'Peso', unit: 'kg', value: '64,1', last: '64,6' },
      { label: 'Grasa corporal', unit: '%', value: '', last: '24,8' },
      { label: 'Masa muscular', unit: 'kg', value: '', last: '46,2' },
      { label: 'Agua corporal', unit: '%', value: '', last: '52,4' },
      { label: 'Grasa visceral', unit: 'nivel', value: '', last: '6' },
      { label: 'Masa ósea', unit: 'kg', value: '', last: '2,4' },
      { label: 'Metabolismo basal', unit: 'kcal', value: '', last: '1.390' },
      { label: 'Edad metabólica', unit: 'años', value: '', last: '26' }
    ];
    const labels = { basico: 'Medidas', avanzado: 'Bioimpedancia' };
    const tabs = Object.keys(labels).map((k) => ({
      label: labels[k],
      on: this.state.tipo === k ? 'true' : 'false',
      bg: this.state.tipo === k ? '#FFFFFF' : 'transparent',
      fw: this.state.tipo === k ? 800 : 600,
      pick: () => this.setState({ tipo: k })
    }));
    const adv = this.state.tipo === 'avanzado';
    return { tabs, adv, fields: adv ? avanzado : basico };
  }
}
</script>
</body>
</html>
