<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Progreso · Android</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7A1E2C;text-decoration:none}a:hover{color:#5C1521}
</style>
</helmet>
<div style="width: 412px; height: 915px; box-sizing: border-box; background: #FAF6F4; color: #2A1216; font-family: Poppins, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 36px 16px 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px">
    <div style="display: flex; flex-direction: column">
      <h1 style="margin: 0; font-size: 22px; font-weight: 700">Tu progreso</h1>
      <span style="font-size: 13px; color: #6E4D52">Desde el 2 de julio</span>
    </div>
    <span style="font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 8px; background: #FFF1D6; color: #7A4B00">Chequeo en 4 días</span>
  </header>

  <div style="flex-grow: 1; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid #A68A8E; border-radius: 20px; overflow: hidden" role="group" aria-label="Medida a mostrar">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <button onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="height: 40px; border: none; border-right: {{t.sep}}; background: {{t.bg}}; color: {{t.fg}}; font-family: inherit; font-size: 14px; font-weight: {{t.fw}}; cursor: pointer">{{t.label}}</button>
      </sc-for>
    </div>

    <div style="background: #FFFFFF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 3px rgba(42,18,22,0.12)">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <div style="display: flex; align-items: baseline; gap: 6px"><span style="font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums">{{current}}</span><span style="font-size: 15px; color: #6E4D52">{{unit}}</span></div>
        <span style="font-size: 14px; font-weight: 700; color: #7A1E2C">{{delta}}</span>
      </div>
      <div style="height: 150px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; align-items: end; border-bottom: 1px solid #EBDDD8" role="img" aria-label="Evolución de {{tabLabel}} en los últimos 5 chequeos">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="5">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; justify-content: flex-end; height: 150px">
            <span style="font-size: 11px; font-weight: 700; color: #6E4D52; font-variant-numeric: tabular-nums">{{b.v}}</span>
            <div style="width: 100%; height: {{b.h}}; border-radius: 6px 6px 0 0; background: {{b.c}}"></div>
          </div>
        </sc-for>
      </div>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; font-size: 11px; color: #6E4D52; font-weight: 600; text-align: center">
        <span>Jul</span><span>Ago</span><span>Sep</span><span>Oct</span><span>Hoy</span>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 16px; padding: 4px 16px; box-shadow: 0 1px 3px rgba(42,18,22,0.12)">
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) 64px 64px 56px; gap: 8px; padding: 10px 0 6px; font-size: 11px; color: #6E4D52; font-weight: 600">
        <span>Medida</span><span style="text-align: right">Inicio</span><span style="text-align: right">Hoy</span><span style="text-align: right">Cambio</span>
      </div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
        <div style="display: grid; grid-template-columns: minmax(0, 1fr) 64px 64px 56px; gap: 8px; align-items: center; padding: 10px 0; border-top: 1px solid #F2E7E4; font-size: 14px">
          <span style="font-weight: 600">{{r.name}}</span>
          <span style="color: #6E4D52; text-align: right; font-variant-numeric: tabular-nums">{{r.start}}</span>
          <span style="font-weight: 700; text-align: right; font-variant-numeric: tabular-nums">{{r.now}}</span>
          <span style="color: #7A1E2C; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums">{{r.diff}}</span>
        </div>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <a href="AndroidRecords.dc.html" style="height: 48px; border-radius: 24px; border: 1px solid #A68A8E; color: #7A1E2C; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-sizing: border-box; text-align: center">Récords</a>
      <a href="AndroidComposicion.dc.html" style="height: 48px; border-radius: 24px; border: 1px solid #A68A8E; color: #7A1E2C; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-sizing: border-box; text-align: center">Composición</a>
      <a href="AndroidNuevoChequeo.dc.html" style="height: 48px; border-radius: 24px; background: #7A1E2C; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-align: center">Nuevo chequeo</a>
    </div>
  </div>

  <nav aria-label="Navegación principal" style="height: 96px; box-sizing: border-box; padding: 12px 8px 16px; background: #F3E9E6; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start">
    <a href="AndroidHoy.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: #6E4D52">
      <span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21H3z"/></svg></span>Hoy</a>
    <a href="AndroidEntrenamiento.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: #6E4D52">
      <span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5h11"/><path d="M6.5 17.5h11"/><path d="M6.5 4v16"/><path d="M17.5 4v16"/></svg></span>Entrenar</a>
    <a href="AndroidProgreso.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: #2A1216">
      <span style="width: 64px; height: 32px; border-radius: 16px; background: #F6E9C9; display: flex; align-items: center; justify-content: center; color: #7A1E2C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg></span>Progreso</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'peso' };
  }
  renderVals() {
    const data = {
      peso: { label: 'Peso', unit: 'kg', vals: [68.4, 67.1, 66.3, 65.2, 64.6] },
      cintura: { label: 'Cintura', unit: 'cm', vals: [82, 80, 78.5, 77, 76] },
      cadera: { label: 'Cadera', unit: 'cm', vals: [101, 100, 99, 98.5, 97.5] }
    };
    const d = data[this.state.tab];
    const min = Math.min(...d.vals) - 2;
    const max = Math.max(...d.vals);
    const bars = d.vals.map((v, i) => ({
      v: String(v).replace('.', ','),
      h: Math.round(20 + (v - min) / (max - min) * 100) + 'px',
      c: i === d.vals.length - 1 ? '#7A1E2C' : '#E7CFCB'
    }));
    const diff = (d.vals[d.vals.length - 1] - d.vals[0]).toFixed(1).replace('.', ',');
    const keys = Object.keys(data);
    const tabs = keys.map((k, i) => {
      const on = this.state.tab === k;
      return {
        label: data[k].label,
        on: on ? 'true' : 'false',
        bg: on ? '#F6E9C9' : 'transparent',
        fg: on ? '#5C1521' : '#2A1216',
        fw: on ? 700 : 600,
        sep: i < keys.length - 1 ? '1px solid #A68A8E' : 'none',
        pick: () => this.setState({ tab: k })
      };
    });
    const rows = [
      { name: 'Peso (kg)', start: '68,4', now: '64,6', diff: '−3,8' },
      { name: 'Cintura (cm)', start: '82', now: '76', diff: '−6' },
      { name: 'Cadera (cm)', start: '101', now: '97,5', diff: '−3,5' },
      { name: 'Brazo der. (cm)', start: '29', now: '28,5', diff: '−0,5' }
    ];
    return {
      tabs, bars, rows,
      tabLabel: d.label.toLowerCase(),
      current: String(d.vals[d.vals.length - 1]).replace('.', ','),
      unit: d.unit,
      delta: diff + ' ' + d.unit + ' desde julio'
    };
  }
}
</script>
</body>
</html>
