<!doctype html>
<html lang="es" style="color-scheme: dark">
<head>
<meta charset="utf-8">
<title>Lista de mercado · oscuro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#E2C171;text-decoration:none}a:hover{color:#E9D6A8}
</style>
</helmet>
<div style="width: 390px; height: 1000px; box-sizing: border-box; background:#111214; color:#EDEEF0; font-family: Poppins, system-ui, sans-serif; display: flex; flex-direction: column; padding: 60px 20px 28px; gap: 14px">
  <div style="display: flex; align-items: center; gap: 10px">
    <a href="MainOscuro.dc.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius:22px; background:#1C1D20; border:1px solid #34353A; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EDEEF0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 13px; color:#A7AAB1; font-weight: 500">Sale de tu plan de alimentación</span>
      <h1 style="margin: 0; font-size: 22px; font-weight: 800">Lista de mercado</h1>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background:#2A2B2F; padding: 4px; border-radius:14px" role="group" aria-label="Para cuántos días">
    <sc-for list="{{spans}}" as="s" hint-placeholder-count="3">
      <button onClick="{{s.pick}}" aria-pressed="{{s.on}}" style="height: 40px; border-radius:11px; border:none; background: {{s.bg}}; color:#EDEEF0; font-family: inherit; font-size: 13px; font-weight: {{s.fw}}; cursor: pointer">{{s.label}}</button>
    </sc-for>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; color:#A7AAB1; font-weight: 600">
    <span>{{doneCount}} de {{total}} comprados</span>
    <span>Según las opciones que más escoges</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
      <div style="background:#1C1D20; border:1px solid #2A2B2F; border-radius:18px; padding: 6px 14px">
        <h2 style="margin: 10px 0 4px; font-size: 13px; font-weight: 800; color:#E2C171; text-transform: uppercase; letter-spacing: 0.6px">{{g.name}}</h2>
        <sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
          <button role="checkbox" aria-checked="{{it.on}}" onClick="{{it.toggle}}" style="width: 100%; min-height: 48px; border:none; border-top:1px solid #26272B; background:transparent; display: flex; align-items: center; gap: 12px; padding: 0; font-family: inherit; color:#EDEEF0; cursor: pointer; text-align: left">
            <span style="width: 24px; height: 24px; border-radius:7px; border: {{it.box}}; background: {{it.fill}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
            </span>
            <span style="flex-grow: 1; font-size: 15px; font-weight: 600; text-decoration: {{it.strike}}; color: {{it.color}}">{{it.name}}</span>
            <span style="font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; color: {{it.color}}">{{it.qty}}</span>
          </button>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <button style="height: 50px; border-radius:14px; border:1px solid #34353A; background:#1C1D20; color:#EDEEF0; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Agregar algo</button>
    <button style="height: 50px; border-radius:14px; border:none; background:#25262A; color:#FFFFFF; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer">Compartir lista</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { days: 7, done: { 'Huevos': true, 'Pechuga de pollo': true } };
  }
  renderVals() {
    const base = [
      { name: 'Proteínas', items: [['Pechuga de pollo', 1.2, 'kg'], ['Huevos', 30, 'und'], ['Tilapia', 0.7, 'kg'], ['Yogur griego', 1.75, 'kg']] },
      { name: 'Carbohidratos', items: [['Arroz blanco', 1, 'kg'], ['Arepas blancas', 14, 'und'], ['Papa', 2, 'kg'], ['Avena en hojuelas', 0.32, 'kg']] },
      { name: 'Frutas y verduras', items: [['Papaya', 1.4, 'kg'], ['Banano', 7, 'und'], ['Lechuga y tomate', 1.5, 'kg'], ['Aguacate', 2, 'und']] },
      { name: 'Grasas', items: [['Nueces o almendras', 0.1, 'kg']] }
    ];
    const f = this.state.days / 7;
    const fmt = (q, u) => {
      const v = u === 'und' ? Math.ceil(q * f) : Math.round(q * f * 100) / 100;
      return String(v).replace('.', ',') + ' ' + u;
    };
    let total = 0, doneCount = 0;
    const groups = base.map((g) => ({
      name: g.name,
      items: g.items.map((x) => {
        const on = !!this.state.done[x[0]];
        total++; if (on) doneCount++;
        return {
          name: x[0], qty: fmt(x[1], x[2]), on: on ? 'true' : 'false',
          box: on ? '2px solid #D4A537' : '2px solid #4A4B52',
          fill: on ? '#4A4B52' : 'transparent',
          strike: on ? 'line-through' : 'none',
          color: on ? '#7E828A' : '#EDEEF0',
          toggle: () => this.setState({ done: { ...this.state.done, [x[0]]: !on } })
        };
      })
    }));
    const spans = [[3, '3 días'], [7, 'Semana'], [15, 'Quincena']].map((s) => ({
      label: s[1], on: this.state.days === s[0] ? 'true' : 'false',
      bg: this.state.days === s[0] ? '#1C1D20' : 'transparent', fw: this.state.days === s[0] ? 800 : 600,
      pick: () => this.setState({ days: s[0] })
    }));
    return { groups, spans, total, doneCount };
  }
}
</script>
</body>
</html>
