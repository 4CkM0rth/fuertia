# Servicios locales de Fuertia (semanas 1 a 6, antes de AWS).
# PostgreSQL reemplaza a RDS, Redis a ElastiCache, RustFS a S3 y Mailpit a SES.
# El backend los lee por variables de entorno: en AWS solo cambian los valores, no el código.
#
#   docker compose up -d      levanta todo
#   docker compose down       apaga (los datos quedan en los volúmenes)
#
# Los puertos se atan a 127.0.0.1: así nadie en la misma red Wi-Fi puede entrar
# a la base, a Redis o al almacenamiento con estas credenciales locales.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fuertia
      POSTGRES_USER: fuertia
      POSTGRES_PASSWORD: fuertia_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuertia -d fuertia"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Almacenamiento compatible con S3. Reemplaza a MinIO, que dejó de publicar imágenes de Docker.
  rustfs:
    image: rustfs/rustfs:1.0.4
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: fuertia
      RUSTFS_SECRET_KEY: fuertia_local
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "127.0.0.1:9000:9000"   # API compatible con S3
      - "127.0.0.1:9001:9001"   # consola web: http://localhost:9001
    volumes:
      - almacenamiento-datos:/data

  # Buzón falso: atrapa los correos que envía el backend y los muestra en http://localhost:8025.
  # No manda nada a internet. En AWS el mismo adaptador SMTP habla con SES.
  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # bandeja web

  # Crea los buckets privados una sola vez (igual que los crearía Terraform en AWS).
  # Usa la AWS CLI oficial, que habla con cualquier servicio compatible con S3.
  buckets:
    image: amazon/aws-cli:2.39.3
    depends_on:
      - rustfs
    environment:
      AWS_ACCESS_KEY_ID: fuertia
      AWS_SECRET_ACCESS_KEY: fuertia_local
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        s3="aws --endpoint-url http://rustfs:9000 s3api"
        # Espera a que el almacenamiento responda (hasta 60 segundos).
        for intento in $$(seq 1 30); do $$s3 list-buckets > /dev/null 2>&1 && break; sleep 2; done
        for bucket in fuertia-fotos-comida fuertia-pdf; do
          $$s3 head-bucket --bucket $$bucket 2>/dev/null || $$s3 create-bucket --bucket $$bucket
        done
        $$s3 list-buckets --query "Buckets[].Name" --output text

volumes:
  postgres-datos:
  almacenamiento-datos:
